# Manual alternative: paste this section directly into your moonraker.conf once.
# Replace YOUR_USER with your username, or use the actual clone path.
# Alternatively run ~/Klipper-firmware-auto-updater/kcm.sh moonraker-setup;
# the helper writes this section for you. Choose one setup method.
# Existing extra settings files and their includes can stay in place;
# move only an old KCM updater section into the main configuration.
# Enable [update_manager] once in the main configuration if needed.
# This updates application files; it never starts a firmware flash.
# The dev channel follows main source commits, not GitHub release tags.

[update_manager klipper-component-manager]
type: git_repo
channel: dev
path: /home/YOUR_USER/Klipper-firmware-auto-updater
origin: https://github.com/Darth-Kuni/Klipper-firmware-auto-updater.git
primary_branch: main
is_system_service: False
