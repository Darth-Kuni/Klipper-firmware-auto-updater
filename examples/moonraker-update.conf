# Example only: replace YOUR_USER and ensure the dedicated application
# directory contains the release bundle's .pyz and release_info.json.
# Enable [update_manager] once in the main configuration if needed.
# This updates application files; it never starts a firmware flash.

[update_manager klipper-component-manager]
type: zip
channel: stable
repo: Darth-Kuni/Klipper-firmware-auto-updater
path: /home/YOUR_USER/klipper-component-manager-app
is_system_service: False
