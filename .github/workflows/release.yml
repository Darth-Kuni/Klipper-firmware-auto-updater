name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate the release tag and package version
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          from kcm import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), "Use a vMAJOR.MINOR.PATCH tag"
          assert tag == "v" + __version__, "The tag must match kcm.__version__"
          match = re.search(r'^version\s*=\s*"([^\"]+)"', Path("pyproject.toml").read_text(), re.MULTILINE)
          assert match and match.group(1) == __version__, "The package and application versions must agree"
      - name: Run tests without printer access
        run: python -m unittest discover -s tests
      - name: Build the installable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Build standalone downloads and Moonraker bundle
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, "tools/build_release.py", "--repository", os.environ["GITHUB_REPOSITORY"]], check=True)
      - name: Verify downloads and prepare release notes
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import zipfile
          from kcm import __version__
          dist = Path("dist").resolve()
          assets = [path for path in dist.iterdir() if path.suffix in {".pyz", ".whl", ".zip"}]
          assert any(path.suffix == ".whl" for path in assets), "Wheel is missing"
          program = dist / f"klipper-component-manager-{__version__}.pyz"
          assert program.is_file(), "Versioned standalone application is missing"
          stable = dist / "klipper-component-manager.pyz"
          assert stable.is_file() and stable.read_bytes() == program.read_bytes(), "Stable application alias differs"
          for path in assets:
              with zipfile.ZipFile(path) as package:
                  assert package.testzip() is None, f"Corrupt download: {path.name}"
                  if path.suffix in {".pyz", ".whl"}:
                      assert "kcm/data/boards.json" in package.namelist(), "Board references are missing"
          repository = os.environ["GITHUB_REPOSITORY"]
          owner, project = repository.split("/", 1)
          with zipfile.ZipFile(dist / "klipper-component-manager-moonraker.zip") as bundle:
              assert "klipper-component-manager.pyz" in bundle.namelist()
              info = json.loads(bundle.read("release_info.json"))
              assert info["project_owner"] == owner and info["project_name"] == project
              assert info["version"] == "v" + __version__
          recorded = set()
          for line in (dist / "SHA256SUMS.txt").read_text().splitlines():
              expected, name = line.split("  ", 1)
              path = dist / name
              assert path.resolve().parent == dist and path.is_file(), "Invalid checksum path"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, f"Checksum mismatch: {name}"
              recorded.add(name)
          assert {path.name for path in assets} <= recorded, "A published download is missing its checksum"
          with tempfile.TemporaryDirectory(prefix="kcm-release-smoke-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              command = [sys.executable, str(program), "--data-dir", str(Path(temporary) / "state")]
              subprocess.run(command + ["--version"], check=True)
              subprocess.run(command + ["boards", "EBB36"], check=True)
          tag = os.environ["GITHUB_REF_NAME"]
          notes = (
              f"Standalone Linux terminal application {tag}. Python 3.10 or newer is required.\n\n"
              "Download the versioned `.pyz` to run the program directly with Python. "
              "The wheel supports conventional Python installation; the source ZIP includes the source and tests.\n\n"
              "For an existing Moonraker-managed installation, use `klipper-component-manager-moonraker.zip` "
              "through the documented update-manager configuration. The app update does not flash printer boards.\n\n"
              f"Read the [setup and update instructions](https://github.com/{repository}/blob/{tag}/README.md) "
              "before using a printer.\n\n"
              "Alpha release for controlled testing. Automated tests cover software behavior and local Git operations; "
              "they do not establish compatibility with untested physical boards. "
              "Initial bootloader installation and printer commissioning require the documented physical checks.\n\n"
              "SHA256SUMS.txt contains hashes for the downloadable application, packages, and Moonraker bundle.\n"
          )
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(notes, encoding="utf-8")
      - name: Publish checked release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.pyz dist/*.whl dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME Alpha" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
